title: HAPSIC Mission Control
views:
  - type: panel
    path: humidifier2
    title: Humidifier2
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: HAPSIC Mission Control
            subtitle: >-
              {{ states('sensor.hapsic_fsm_state') | upper }} • Target {{
              states('input_number.target_dew_point') }} °F DP • {{
              states('sensor.hapsic_fault_reason') }}
          - type: markdown
            title: Delivery measurement and calibration
            content: |
              {% set online = states('sensor.hapsic_diagnostics_producer') not in ['unknown', 'unavailable', ''] %}
              {% set calibration = states('sensor.hapsic_diagnostic_calibration') %}
              {% set reason = states('sensor.hapsic_diagnostic_qualification') %}
              {% set explanations = {
                'CLOCK_UNSYNCHRONIZED': 'Observation timing has not been verified.',
                'UNVERIFIED_PROVENANCE_OR_AIRFLOW': 'Sensor reporting and airflow units have not been verified.',
                'INVALID_OR_MISSING_SOURCE': 'A required measurement is missing or invalid.',
                'LOW_FLOW': 'Airflow is too low for delivery qualification.',
                'WARMUP': 'Waiting for warmup to finish.',
                'STABILIZING': 'Waiting for five minutes of stable operating conditions.',
                'OUTSIDE_BASELINE_ENVELOPE': 'Current conditions are outside the accepted baseline range.',
                'MEASUREMENT_MISMATCH': 'Measurements disagree beyond the documented uncertainty.',
                'STORAGE_ERROR': 'Diagnostic evidence storage needs attention.'
              } %}
              {% macro reading(entity, unit, precision=1) -%}
                {%- set value = states(entity) -%}
                {%- if online and is_number(value) -%}
                  {{- ('%.' ~ precision ~ 'f') | format(value | float) -}}{{- unit -}}
                  {%- if state_attr(entity, 'status') == 'provisional' %} (provisional){% endif -%}
                {%- elif online and state_attr(entity, 'status') == 'stale' -%}
                  Stale — waiting for recent evidence
                {%- else -%}
                  Not available yet
                {%- endif -%}
              {%- endmacro %}
              {% if not online %}
              **Waiting for diagnostic producer**

              Delivery diagnostics have not connected or their updates have expired.
              {% elif calibration == 'uncalibrated' %}
              **Commissioning required**

              {{ explanations.get(reason, 'Waiting for verified inputs, a baseline and an owner-confirmed healthy reference.') }}
              {% elif calibration == 'provisional' %}
              **Provisional reference — measurement accuracy is not yet established**

              {{ explanations.get(reason, 'Results are empirical estimates under comparable operating conditions.') }}
              {% elif calibration == 'valid' %}
              **Delivery diagnostics**

              {{ explanations.get(reason, 'Results use the accepted reference where operating conditions match.') }}
              {% else %}
              **Waiting for calibration status**

              Diagnostic updates are arriving, but calibration information is not available yet.
              {% endif %}

              | Measurement | Current result |
              | :--- | :--- |
              | Estimated steam delivery | {{ reading('sensor.hapsic_estimated_steam_delivery_imperial', ' lb/h', 2) }} |
              | Delivery performance | {{ reading('sensor.hapsic_delivery_performance', '%') }} |
              | Canister performance | {{ reading('sensor.hapsic_canister_performance', '%') }} |

              **Baseline:** {{ 'Accepted' if online and state_attr('sensor.hapsic_diagnostic_calibration', 'baseline') is mapping else 'Not collected yet' }}

              **Healthy reference:** {{ 'Accepted' if online and state_attr('sensor.hapsic_diagnostic_calibration', 'reference') is mapping else 'Not accepted yet' }}

              **High-demand evidence:** {{ reading('sensor.hapsic_canister_evidence_hours', ' h', 2) }}

              {% set age = states('sensor.hapsic_diagnostic_evidence_age') %}
              **Newest canister evidence:** {{ ((age | float / 3600) | round(1) | string) ~ ' h ago' if online and is_number(age) and age | float >= 0 else 'No eligible evidence yet' }}

              {% set coverage = state_attr('sensor.hapsic_diagnostic_calibration', 'coverage') %}
              **Reference coverage:** {{ coverage | length if online and coverage is sequence and coverage is not string else 0 }} accepted demand bins.

              {% set lower = state_attr('sensor.hapsic_delivery_performance', 'lower') %}
              {% set upper = state_attr('sensor.hapsic_delivery_performance', 'upper') %}
              **Delivery uncertainty:** {{ (lower | round(1) | string) ~ '–' ~ (upper | round(1) | string) ~ '%' if online and is_number(lower) and is_number(upper) else 'No verified bounds yet' }}

              Delivery is an estimate between sensor locations. Performance requires
              comparable conditions and an accepted healthy reference. Missing
              evidence does not indicate poor canister condition.
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hapsic_fsm_state
                state: FAULT
            card:
              type: vertical-stack
              cards:
                - type: tile
                  entity: sensor.hapsic_fault_reason
                  name: FAULT ACTIVE
                  icon: mdi:alert-octagon
                  color: red
                - type: markdown
                  content: |
                    ### 🛑 Logic Lockout Active
                    The controller has entered safety shutdown.
                    **Reason:** {{ states('sensor.hapsic_fault_reason') }}
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.hapsic_fsm_state
                state: FAULT
              - condition: state
                entity: sensor.hapsic_fault_reason
                state: Economizer Bypass Active
            card:
              type: markdown
              content: >
                ### Economizer Bypass Active
                HAPSIC is yielding because the controller reported an economizer
                bypass fault state.
          - type: horizontal-stack
            cards:
              - type: tile
                entity: input_number.target_dew_point
                name: Target Dew Point
                icon: mdi:thermometer-water
                color: deep-purple
              - type: tile
                entity: sensor.hapsic_steam_voltage
                name: Output V
                icon: mdi:flash-auto
                color: >-
                  {% if states('sensor.hapsic_steam_voltage')|float(0) > 0 %} orange {%
                  else %} grey {% endif %}
              - type: tile
                entity: input_number.humidifier_max_capacity
                name: Capacity
                icon: mdi:kettle-steam
                color: cyan
          - type: grid
            columns: 2
            square: false
            cards:
              - type: gauge
                entity: sensor.hapsic_steam_mass
                name: Injection Rate
                unit: lbs/hr
                min: 0
                max: 6
                needle: true
                severity:
                  green: 0
                  yellow: 4
                  red: 5.5
              - type: vertical-stack
                cards:
                  - type: custom:mushroom-template-card
                    entity: sensor.hapsic_canister_performance
                    primary: Canister Performance
                    secondary: >-
                      {{ states(entity) ~ '%' if is_number(states(entity)) else ('Commissioning required' if states('sensor.hapsic_diagnostic_calibration') == 'uncalibrated' else 'No eligible result yet') }}
                    icon: mdi:gauge
                    tap_action:
                      action: more-info
                  - type: markdown
                    content: >
                      <center><b>Boiler State:</b> <span style="color: {% if
                      states('sensor.hapsic_boil_status') == 'BOILING' %} red {%
                      else %} grey {% endif %};">{{
                      states('sensor.hapsic_boil_status') }}</span></center>
          - type: heading
            heading: Boiler Health & Characterization
            heading_style: title
          - type: grid
            columns: 4
            square: false
            cards:
              - type: tile
                entity: sensor.hapsic_steam_mass
                name: Commanded Steam
                icon: mdi:gauge-empty
                color: >-
                  {% set val = states('sensor.hapsic_steam_mass')|float(0) %}
                  {% if val > 0 %} blue {% else %} grey {% endif %}
                state_content: state
              - type: custom:mushroom-template-card
                entity: sensor.hapsic_estimated_steam_delivery_imperial
                primary: Estimated Steam Delivery
                secondary: >-
                  {{ states(entity) ~ ' lb/h' if is_number(states(entity)) else ('Commissioning required' if states('sensor.hapsic_diagnostic_calibration') == 'uncalibrated' else 'No eligible result yet') }}
                icon: mdi:gauge-full
                tap_action:
                  action: more-info
              - type: custom:mushroom-template-card
                entity: sensor.hapsic_delivery_performance
                primary: Delivery Performance
                secondary: >-
                  {{ states(entity) ~ '%' if is_number(states(entity)) else ('Commissioning required' if states('sensor.hapsic_diagnostic_calibration') == 'uncalibrated' else 'No eligible result yet') }}
                icon: mdi:percent-circle
                tap_action:
                  action: more-info
              - type: tile
                entity: sensor.hapsic_boil_status
                name: Boiler State
                icon: >-
                  {% if states('sensor.hapsic_boil_status') == 'BOILING' %}
                  mdi:fire {% else %} mdi:snowflake {% endif %}
                color: >-
                  {% if states('sensor.hapsic_boil_status') == 'BOILING' %}
                  red {% else %} grey {% endif %}
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Steam Output \u2014 Control Model vs Estimated Delivery (lbs/hr)"
              show_states: true
              colorize_states: true
            graph_span: 12h
            series:
              - entity: sensor.hapsic_steam_mass
                name: Commanded
                stroke_width: 2
                color: "#42a5f5"
                curve: stepline
                show:
                  in_header: true
              - entity: sensor.hapsic_estimated_steam_delivery_imperial
                name: Estimated Delivery
                stroke_width: 2
                color: "#66bb6a"
                curve: smooth
                show:
                  in_header: true
              - entity: input_number.humidifier_max_capacity
                name: Configured Nameplate Capacity
                stroke_width: 1
                color: "#ef5350"
                opacity: 0.4
                curve: stepline
                show:
                  in_header: false
            yaxis:
              - decimals: 2
          - type: custom:apexcharts-card
            header:
              show: true
              title: Delivery Performance (%)
              show_states: true
              colorize_states: true
            graph_span: 12h
            experimental:
              color_threshold: true
            series:
              - entity: sensor.hapsic_delivery_performance
                name: Delivery Performance
                stroke_width: 2
                curve: smooth
                show:
                  in_header: true
                color_threshold:
                  - value: 0
                    color: "#f44336"
                  - value: 60
                    color: "#ff9800"
                  - value: 90
                    color: "#4caf50"
            yaxis:
              - decimals: 0
          - type: markdown
            title: Boiler Curve (Learned)
            content: |
              {% set curve = states('input_text.hapsic_boiler_curve') %}
              {% set record = curve | from_json(none) %}
              {% if record is mapping and record.get('v') == 2 %}
              {% set bins = record.get('curve', [0,0,0,0]) %}
              {% set counts = record.get('counts') %}
              {% elif record is sequence and record is not string %}
              {% set bins = record %}
              {% set counts = none %}
              {% else %}
              {% set bins = [0,0,0,0] %}
              {% set counts = none %}
              {% endif %}
              {% if bins is not sequence or bins is string or bins|length != 4 %}
              {% set bins = [0,0,0,0] %}
              {% endif %}
              {% if counts is not sequence or counts is string or counts|length != 4 %}
              {% set counts = none %}
              {% endif %}
              {% set b0 = bins[0] if bins[0] is number else 0 %}
              {% set b1 = bins[1] if bins[1] is number else 0 %}
              {% set b2 = bins[2] if bins[2] is number else 0 %}
              {% set b3 = bins[3] if bins[3] is number else 0 %}
              {% set c0 = counts[0] if counts is not none and counts[0] is number else '—' %}
              {% set c1 = counts[1] if counts is not none and counts[1] is number else '—' %}
              {% set c2 = counts[2] if counts is not none and counts[2] is number else '—' %}
              {% set c3 = counts[3] if counts is not none and counts[3] is number else '—' %}
              | Voltage Band | 2-4V | 4-6V | 6-8V | 8-10V |
              | :---: | :---: | :---: | :---: | :---: |
              | **Capacity (lb/hr)** | {{ '%.2f'|format(b0) }} | {{ '%.2f'|format(b1) }} | {{ '%.2f'|format(b2) }} | {{ '%.2f'|format(b3) }} |
              | **Samples** | {{ c0 }} | {{ c1 }} | {{ c2 }} | {{ c3 }} |
              | **Bar** | {{ '█' * ([40, [0, (b0*10)|int]|max]|min) }} | {{ '█' * ([40, [0, (b1*10)|int]|max]|min) }} | {{ '█' * ([40, [0, (b2*10)|int]|max]|min) }} | {{ '█' * ([40, [0, (b3*10)|int]|max]|min) }} |

              {% if counts is not none and c0 == 0 and c1 == 0 and c2 == 0 and c3 == 0 %}
              **Not trained yet.** New bins need 50 eligible positive observations
              before control can use their learned capacity.
              {% elif counts is none %}
              Legacy curve: training counts are unavailable.
              {% else %}
              Bins need 50 eligible positive observations before control uses them.
              {% endif %}
          - type: custom:apexcharts-card
            header:
              show: true
              title: "Legacy Control CHI (not calibrated performance)"
              show_states: true
              colorize_states: true
            graph_span: 12h
            experimental:
              color_threshold: true
            series:
              - entity: sensor.hapsic_chi_instant
                name: "\u03C7 Instant"
                stroke_width: 1
                opacity: 0.6
                show:
                  in_header: true
                color_threshold:
                  - value: 0
                    color: "#f44336"
                  - value: 70
                    color: "#ff9800"
                  - value: 90
                    color: "#4caf50"
              - entity: input_number.hapsic_chi_ema
                name: "Legacy CHI EMA (%)"
                transform: return x * 100;
                stroke_width: 2
                color: "#9b59b6"
                curve: smooth
                show:
                  in_header: true
            yaxis:
              - min: 0
                decimals: 0
          - type: heading
            heading: Physics Engine (Decoupled)
            heading_style: title
          - type: entities
            title: State Vector
            show_header_toggle: false
            entities:
              - entity: sensor.hapsic_room_dew_point
                name: Actual Dew Point (Goal Metric)
                icon: mdi:water-thermometer
              - entity: sensor.hapsic_room_average_temp
                name: Actual Temp
              - entity: sensor.hapsic_room_average_rh
                name: Actual RH
              - entity: sensor.hapsic_cleansed_supply_temp
                name: Supply Temp (T_sup)
              - entity: sensor.hapsic_cleansed_supply_rh
                name: Supply RH (Baseline)
              - entity: sensor.hapsic_supply_flow
                name: Airflow Mass (m3/h)
                icon: mdi:fan
          - type: heading
            heading: Duct Safety Monitor
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - type: entities
                title: Pre-Steam (Supply)
                show_header_toggle: false
                entities:
                  - entity: sensor.hapsic_cleansed_supply_temp
                    name: Temp
                    icon: mdi:thermometer-chevron-down
                  - entity: sensor.hapsic_cleansed_supply_rh
                    name: Humidity
                    icon: mdi:water-minus
              - type: entities
                title: Post-Steam (Duct)
                show_header_toggle: false
                entities:
                  - entity: sensor.hapsic_cleansed_post_steam_temp
                    name: Temp
                    icon: mdi:thermometer-chevron-up
                  - entity: sensor.hapsic_cleansed_post_steam_rh
                    name: Humidity
                    icon: mdi:water-plus
                    card_mod:
                      style: |
                        :host {
                          --paper-item-icon-color:
                            {% if states(config.entity)|float(0) > 85 %} red
                            {% elif states(config.entity)|float(0) > 80 %} orange
                            {% else %} green {% endif %};
                        }
          - type: gauge
            entity: sensor.hapsic_cleansed_post_steam_rh
            name: Duct Saturation Safety
            unit: "%"
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 80
              red: 90
          - type: heading
            heading: Moisture Balance Engine
            heading_style: title
          - type: custom:apexcharts-card
            header:
              show: true
              title: 1. ENGINE EFFORT
              show_states: true
              colorize_states: true
            experimental:
              color_threshold: true
            series:
              - entity: sensor.hapsic_steam_voltage
                name: Steam Output
                stroke_width: 2
                show:
                  in_header: true
                color_threshold:
                  - value: 0
                    color: "#4caf50"
                  - value: 9.5
                    color: "#f44336"
            yaxis:
              - min: 0
                max: 10
                decimals: 1
            graph_span: 2h
          - type: custom:apexcharts-card
            header:
              show: true
              title: 2. WORK DONE (Lift)
              show_states: true
              colorize_states: true
            graph_span: 2h
            series:
              - entity: sensor.hapsic_target_duct_dp
                name: PID Request
                color: "#9b59b6"
                stroke_width: 2
                curve: stepline
              - entity: sensor.hapsic_duct_dp
                name: Actual Discharge
                color: "#ff9800"
                type: area
                opacity: 0.5
                stroke_width: 2
              - entity: sensor.hapsic_pre_steam_dp
                name: Baseline Intake
                color: "#2196f3"
                stroke_width: 2
            now:
              show: true
              label: Current
          - type: custom:apexcharts-card
            header:
              show: true
              title: 3. STRUCTURE VELOCITY
              show_states: true
              colorize_states: true
            graph_span: 2h
            experimental:
              color_threshold: true
            series:
              - entity: sensor.hapsic_structure_velocity
                name: Climb Rate
                type: area
                opacity: 0.3
                stroke_width: 2
                show:
                  in_header: true
                color_threshold:
                  - value: -10
                    color: "#9e9e9e"
                  - value: 0
                    color: "#9c27b0"
            yaxis:
              - min: -1
                max: 1
                decimals: 2
          - type: markdown
            title: Mass Balance Tracker
            content: >
              | Metric | Value | Impact |
              | :--- | :--- | :--- |
              | **Injection** | `{{ states('sensor.hapsic_steam_mass') }} lbs/hr` |
              Wetting ⬆️ |
              | **Ventilation** | `{{ states('sensor.hapsic_ventilation_loss') }}
              lbs/hr` | Drying ⬇️ |
              | **NET FLUX** | **{{ states('sensor.hapsic_net_flux') }} lbs/hr** |
              **{{ 'CHARGING' if states('sensor.hapsic_net_flux')|float(0) > 0 else
              'DRAINING' }}** |
          - type: grid
            columns: 4
            square: false
            cards:
              - type: tile
                entity: binary_sensor.hapsic_economy_advisory_active
                name: Economy Advisory
                icon: mdi:leaf-circle-outline
                color: amber
                state_content: state
              - type: tile
                entity: sensor.hapsic_economy_advisory_reason
                name: Reason
                icon: mdi:comment-alert-outline
                state_content: state
              - type: tile
                entity: sensor.hapsic_economy_negative_net_streak
                name: Negative Streak
                icon: mdi:timer-sand
                state_content: state
              - type: tile
                entity: sensor.hapsic_economy_suggested_target_delta
                name: Suggested Delta
                icon: mdi:target-variant
                state_content: state
          - type: markdown
            title: Economy Promotion Readout
            content: >
              {% set advisory_h = states('sensor.hapsic_economy_advisory_time_7d')|float(0) %}
              {% set severe_h = states('sensor.hapsic_economy_severe_time_7d')|float(0) %}
              {% set steaming_h = states('sensor.hapsic_economy_steaming_time_7d')|float(0) %}
              {% set events = states('sensor.hapsic_economy_advisory_count_7d')|float(0) %}
              {% set ratio = (advisory_h / steaming_h * 100) if steaming_h > 0 else 0 %}
              {% set candidate = steaming_h >= 24 and (ratio >= 25 or severe_h >= 4) %}
              | 7-day metric | Value |
              | :--- | :---: |
              | Advisory while steaming | `{{ advisory_h|round(1) }} h` |
              | Severe advisory | `{{ severe_h|round(1) }} h` |
              | Total steaming | `{{ steaming_h|round(1) }} h` |
              | Advisory share | `{{ ratio|round(0) }}%` |
              | Events | `{{ events|round(0) }}` |
              | **Promotion gate** | **{{ 'CANDIDATE' if candidate else 'KEEP OBSERVING' }}** |
          - type: custom:apexcharts-card
            header:
              show: true
              title: 7-Day Economy Advisory
              show_states: true
              colorize_states: true
            graph_span: 7d
            series:
              - entity: sensor.hapsic_economy_negative_net_streak
                name: Negative Streak
                color: "#ff9800"
                stroke_width: 2
              - entity: sensor.hapsic_economy_severe_net_streak
                name: Severe Streak
                color: "#f44336"
                stroke_width: 2
              - entity: sensor.hapsic_economy_suggested_target_delta
                name: Suggested Delta
                color: "#607d8b"
                stroke_width: 2
          - type: custom:power-flow-card-plus
            title: HAPSIC Physics Engine
            entities:
              solar:
                entity: sensor.hapsic_steam_mass
                name: Steam Input
                color: "#3498db"
                unit_of_measurement: lbs/hr
              battery:
                name: Control-model Net Flux
                entity:
                  consumption: sensor.hapsic_net_flux
                  production: sensor.hapsic_net_flux
                color_icon: true
                color_circle: true
                unit_of_measurement: lbs/hr
                label_consumption: Draining
                label_production: Charging
              home:
                name: Vent Loss
                entity: sensor.hapsic_ventilation_loss
                color_icon: true
                unit_of_measurement: lbs/hr
            dashboard_link: /energy
            display_zero_lines: true
            use_new_flow_rate_model: true
            min_flow_rate: 0.1
            decimals: 2
            watt_threshold: 10000
          - type: heading
            heading: Control Strategy (Loop A)
            heading_style: title
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: sensor.hapsic_room_deficit
                name: Deficit
                icon: mdi:arrow-collapse-down
                color: >-
                  {% set val = states('sensor.hapsic_room_deficit')|float(0) %}  {%
                  if val < -0.5 %} blue  {% elif val < 0.5 %} green  {% elif val <
                  2.0 %} orange  {% else %} red {% endif %}
                state_content: state
              - type: tile
                entity: sensor.hapsic_target_duct_dp
                name: Duct Request
                icon: mdi:target
                color: deep-purple
                state_content: state
              - type: tile
                entity: sensor.hapsic_max_achievable_dp
                name: Control-model Feasibility Limit
                icon: mdi:speedometer
                color: >-
                  {% if states('sensor.hapsic_is_target_infeasible') == 'True' %}
                  red {% else %} green {% endif %}
                state_content: state
          - type: custom:apexcharts-card
            header:
              show: true
              title: Target vs. Actual Dew Point
              show_states: true
              colorize_states: true
            graph_span: 6h
            series:
              - entity: sensor.hapsic_room_dew_point
                name: Actual Dew Point
                color: "#2196f3"
                stroke_width: 2
                curve: smooth
              - entity: input_number.target_dew_point
                name: Target Dew Point
                color: "#9b59b6"
                stroke_width: 2
                curve: stepline
              - entity: sensor.hapsic_max_achievable_dp
                name: Control-model Limit
                color: "#f44336"
                stroke_width: 2
                type: area
                opacity: 0.1
          - title: History
            type: history-graph
            hours_to_show: 12
            entities:
              - sensor.hapsic_pre_steam_dp
              - sensor.hapsic_cleansed_airflow
              - input_number.hapsic_chi_ema
              - sensor.hapsic_duct_dp
              - sensor.hapsic_target_duct_dp
              - sensor.hapsic_max_achievable_dp
              - sensor.hapsic_chi_instant
              - sensor.hapsic_room_dew_point
              - input_number.target_dew_point
              - sensor.hapsic_steam_voltage
