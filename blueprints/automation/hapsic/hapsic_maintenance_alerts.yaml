blueprint:
  name: HAPSIC Maintenance & Awareness
  description: Maintenance notifications for controller faults, control-model feasibility and qualified delivery-performance
    warnings. Canister performance is delivery retention; it does not determine remaining life or identify a physical cause.
  domain: automation
  author: astyrrian1
  source_url: https://github.com/astyrrian1/hapsic/blob/main/blueprints/automation/hapsic/hapsic_maintenance_alerts.yaml
  input:
    notify_service:
      name: Notification Service
      description: 'The notification service to use. Select ''persistent_notification'' for HA UI banners, or type a custom
        service like ''notify.mobile_app_iphone''.

        '
      default: persistent_notification
      selector:
        select:
          options:
          - persistent_notification
          - notify.notify
          - notify.mobile_app
          custom_value: true
    enable_infeasibility_alert:
      name: Enable Target Infeasibility Alert
      description: 'Notify when HAPSIC cannot reach your target dew point for an extended period. Includes the max achievable
        dew point so you can decide whether to lower your setpoint.

        '
      default: true
      selector:
        boolean: null
    infeasibility_duration:
      name: Infeasibility Duration
      description: 'Minutes the target must be infeasible before alerting. Prevents false alarms from brief transient conditions.

        '
      default: 15
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: minutes
          mode: slider
    enable_fault_cleared_alert:
      name: Enable Fault Cleared Alert
      description: 'Notify when HAPSIC recovers from a fault state and resumes normal operation.

        '
      default: true
      selector:
        boolean: null
    enable_canister_health_alert:
      name: Enable Canister Health Alert
      description: Notify only when HAPSIC publishes a calibrated, fully qualified performance warning.
      default: true
      selector:
        boolean: null
    chi_threshold:
      name: CHI EMA Warning Threshold
      description: Legacy input retained for saved-automation compatibility. Configure diagnostic warning/recovery thresholds
        in HAPSIC; defaults are 60% and 65%.
      default: 0.6
      selector:
        number:
          min: 0.2
          max: 1.0
          step: 0.05
          unit_of_measurement: ratio
          mode: slider
    notification_episode_helper:
      name: Notification episode storage
      description: Use a separate helper for each blueprint instance. The distributed package provides this default.
      default: input_text.hapsic_last_performance_alert_episode
      selector:
        entity:
          domain: input_text
variables:
  notify_svc: !input 'notify_service'
  infeasible_enabled: !input 'enable_infeasibility_alert'
  fault_cleared_enabled: !input 'enable_fault_cleared_alert'
  canister_enabled: !input 'enable_canister_health_alert'
  chi_warn: '{{ state_attr(''sensor.hapsic_performance_alert'', ''warning'') }}'
  diagnostics_status: '{{ states(''sensor.hapsic_diagnostic_calibration'') }}'
  delivery_performance: '{{ states(''sensor.hapsic_delivery_performance'') }}'
  canister_performance: '{{ states(''sensor.hapsic_canister_performance'') }}'
  estimated_steam_delivery: '{{ states(''sensor.hapsic_estimated_steam_delivery'') }}'
  evidence_status: '{{ state_attr(''sensor.hapsic_canister_performance'', ''status'') }}'
  measurement_status: '{{ states(''sensor.hapsic_measurement_status'') }}'
  delivery_status: '{{ state_attr(''sensor.hapsic_delivery_performance'', ''status'') }}'
  evidence_hours: '{{ states(''sensor.hapsic_canister_evidence_hours'') }}'
  uncertainty: '{{ dict(lower=state_attr(''sensor.hapsic_canister_performance'', ''lower''), upper=state_attr(''sensor.hapsic_canister_performance'',
    ''upper'')) }}'
  episode_helper: !input 'notification_episode_helper'
  episode_key: '{{ state_attr(''sensor.hapsic_performance_alert'',''producer_id'') ~ '':'' ~ state_attr(''sensor.hapsic_performance_alert'',''generation'')
    ~ '':'' ~ state_attr(''sensor.hapsic_performance_alert'',''reference_id'') ~ '':'' ~ state_attr(''sensor.hapsic_performance_alert'',''episode'')
    }}'
mode: queued
max: 3
max_exceeded: silent
triggers:
- trigger: state
  entity_id: sensor.hapsic_is_target_infeasible
  to: 'True'
  for:
    minutes: !input 'infeasibility_duration'
  id: infeasible
- trigger: state
  entity_id: sensor.hapsic_fsm_state
  from: FAULT
  id: fault_cleared
- trigger: state
  entity_id: sensor.hapsic_performance_alert
  to: warn
  id: canister_degraded
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id: infeasible
    - condition: template
      value_template: '{{ infeasible_enabled }}'
    sequence:
    - variables:
        max_dp: '{{ states(''sensor.hapsic_max_achievable_dp'') }}'
        target_dp: '{{ states(''input_number.target_dew_point'') }}'
        msg: '📉 HAPSIC can''t reach your target dew point. Target: {{ target_dp }}°F | Max achievable: {{ max_dp }}°F. Consider
          lowering your setpoint or check outdoor conditions.'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ notify_svc == ''persistent_notification'' }}'
        sequence:
        - action: persistent_notification.create
          data:
            title: 📉 HAPSIC Target Infeasible
            message: '{{ msg }}'
            notification_id: hapsic_infeasible
      default:
      - action: '{{ notify_svc }}'
        data:
          title: 📉 HAPSIC Target Infeasible
          message: '{{ msg }}'
  - conditions:
    - condition: trigger
      id: fault_cleared
    - condition: template
      value_template: '{{ fault_cleared_enabled }}'
    - condition: not
      conditions:
      - condition: state
        entity_id: sensor.hapsic_fsm_state
        state: FAULT
    sequence:
    - variables:
        new_state: '{{ states(''sensor.hapsic_fsm_state'') }}'
        msg: ✅ HAPSIC fault cleared. Controller now in {{ new_state }}. Humidifier resuming normal operation.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ notify_svc == ''persistent_notification'' }}'
        sequence:
        - action: persistent_notification.create
          data:
            title: ✅ HAPSIC Fault Cleared
            message: '{{ msg }}'
            notification_id: hapsic_fault_cleared
      default:
      - action: '{{ notify_svc }}'
        data:
          title: ✅ HAPSIC Fault Cleared
          message: '{{ msg }}'
  - conditions:
    - condition: trigger
      id: canister_degraded
    - condition: template
      value_template: '{{ canister_enabled }}'
    - condition: template
      value_template: '{{ is_state(''sensor.hapsic_performance_alert'',''warn'') and episode_key != states(episode_helper)
        }}'
    sequence:
    - variables:
        chi_val: '{{ canister_performance }}'
        msg: Estimated canister performance is {{ canister_performance }}% of the accepted healthy reference ({{ evidence_hours
          }} qualified hours; {{ evidence_status }}). HAPSIC verified the warning against its uncertainty bounds. Inspect
          delivery and sensor conditions; this does not establish scale buildup or remaining canister life.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ notify_svc == ''persistent_notification'' }}'
        sequence:
        - action: persistent_notification.create
          data:
            title: 🧪 HAPSIC Canister Health Warning
            message: '{{ msg }}'
            notification_id: hapsic_canister_health
      default:
      - action: '{{ notify_svc }}'
        data:
          title: 🧪 HAPSIC Canister Health Warning
          message: '{{ msg }}'
    - action: input_text.set_value
      target:
        entity_id: '{{ episode_helper }}'
      data:
        value: '{{ episode_key }}'
