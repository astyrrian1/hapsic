blueprint:
  name: HAPSIC Daily Status Digest
  description: Daily HAPSIC conditions with estimated delivery, calibrated performance status and evidence coverage. Legacy
    control-model estimates remain distinct from diagnostic measurements.
  domain: automation
  author: astyrrian1
  source_url: https://github.com/astyrrian1/hapsic/blob/main/blueprints/automation/hapsic/hapsic_daily_digest.yaml
  input:
    notify_service:
      name: Notification Service
      description: 'The notification service to use. Select ''persistent_notification'' for HA UI banners, or type a custom
        service like ''notify.mobile_app_iphone''.

        '
      default: persistent_notification
      selector:
        select:
          options:
          - persistent_notification
          - notify.notify
          - notify.mobile_app
          custom_value: true
    report_time:
      name: Report Time
      description: Time of day to send the daily digest.
      default: 08:00:00
      selector:
        time: null
    weather_entity:
      name: Weather Entity
      description: 'The weather entity to use for outdoor conditions and forecast. Select your preferred provider (NWS, OpenWeatherMap,
        etc.).

        '
      default: weather.kama
      selector:
        entity:
          filter:
          - domain: weather
variables:
  notify_svc: !input 'notify_service'
  weather_ent: !input 'weather_entity'
  fsm_state: '{{ states(''sensor.hapsic_fsm_state'') }}'
  house_rh: '{{ states(''sensor.hapsic_room_average_rh_broken'') }}'
  house_temp: '{{ states(''sensor.hapsic_room_average_temp_broken'') }}'
  house_dp: '{{ states(''sensor.hapsic_room_dew_point'') }}'
  target_dp: '{{ states(''input_number.target_dew_point'') }}'
  room_deficit: '{{ states(''sensor.hapsic_room_deficit'') }}'
  steam_v: '{{ states(''sensor.hapsic_steam_voltage'') | float(0) }}'
  steam_mass: '{{ states(''sensor.hapsic_steam_mass'') }}'
  power_now_w: '{{ (steam_v / 10.0) * 1984 }}'
  power_now_kw: '{{ (power_now_w / 1000) | round(2) }}'
  chi_ema: '{{ states(''input_number.hapsic_chi_ema'') }}'
  chi_instant: '{{ states(''sensor.hapsic_chi_instant'') }}'
  outdoor_dp: '{{ states(''sensor.hapsic_pre_steam_dp'') }}'
  weather_state: '{{ states(weather_ent) }}'
  weather_temp: '{{ state_attr(weather_ent, ''temperature'') }}'
  weather_humidity: '{{ state_attr(weather_ent, ''humidity'') }}'
  weather_wind: '{{ state_attr(weather_ent, ''wind_speed'') }}'
  is_infeasible: '{{ states(''sensor.hapsic_is_target_infeasible'') }}'
  max_achievable: '{{ states(''sensor.hapsic_max_achievable_dp'') }}'
  boil_status: '{{ states(''sensor.hapsic_boil_status'') }}'
  report_msg: 'HAPSIC Daily Report

    State: {{ fsm_state }} | Boil: {{ boil_status }}

    House: {{ house_rh }}% RH | {{ house_temp }}°F | DP {{ house_dp }}°F Target: {{ target_dp }}°F DP (deficit: {{ room_deficit
    }}°F) {% if is_infeasible == ''True'' -%} ⚠ Target infeasible — max achievable: {{ max_achievable }}°F {% endif -%}

    Steam: {{ steam_v }}V ({{ ((steam_v | float(0)) / 10.0 * 100) | round(0) }}%) | {{ steam_mass }} lb/h (control model)
    Power: ~{{ power_now_kw }} kW ({{ power_now_w | round(0) }}W of 1984W max)

    Estimated Steam Delivery: {{ estimated_steam_delivery }} kg/h

    Delivery Performance: {{ delivery_performance }}%

    Canister Performance: {{ canister_performance }}% ({{ evidence_status }}; {{ evidence_hours }} qualified h)

    Measurement: {{ measurement_status }}; delivery status: {{ delivery_status }}. Calibration: {{ diagnostics_status }}. Unknown uncertainty or insufficient coverage is inconclusive.


    Weather: {{ weather_state | title }} | {{ weather_temp }}°F | {{ weather_humidity }}% RH | Wind {{ weather_wind }} mph
    Outdoor DP: {{ outdoor_dp }}°F'
  diagnostics_status: '{{ states(''sensor.hapsic_diagnostic_calibration'') }}'
  delivery_performance: '{{ states(''sensor.hapsic_delivery_performance'') }}'
  canister_performance: '{{ states(''sensor.hapsic_canister_performance'') }}'
  estimated_steam_delivery: '{{ states(''sensor.hapsic_estimated_steam_delivery'') }}'
  evidence_status: '{{ state_attr(''sensor.hapsic_canister_performance'', ''status'') }}'
  measurement_status: '{{ states(''sensor.hapsic_measurement_status'') }}'
  delivery_status: '{{ state_attr(''sensor.hapsic_delivery_performance'', ''status'') }}'
  evidence_hours: '{{ states(''sensor.hapsic_canister_evidence_hours'') }}'
  uncertainty: '{{ dict(lower=state_attr(''sensor.hapsic_canister_performance'', ''lower''), upper=state_attr(''sensor.hapsic_canister_performance'',
    ''upper'')) }}'
mode: single
triggers:
- trigger: time
  at: !input 'report_time'
conditions: []
actions:
- choose:
  - conditions:
    - condition: template
      value_template: '{{ notify_svc == ''persistent_notification'' }}'
    sequence:
    - action: persistent_notification.create
      data:
        title: 📊 HAPSIC Daily Report
        message: '{{ report_msg }}'
        notification_id: hapsic_daily_digest
  default:
  - action: '{{ notify_svc }}'
    data:
      title: 📊 HAPSIC Daily Report
      message: '{{ report_msg }}'
