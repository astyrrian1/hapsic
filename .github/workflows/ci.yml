name: HAPSIC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check apps/hapsic-controller/hapsic_controller.py scenario_builder.py scenario_tester.py run_compare.py --select E,W --ignore E402,E501,E701,W291,W292,W293

      - name: Unit Tests - Psychrometrics
        run: python3 test_psychrometrics.py

      - name: Unit Tests - Unit Conversions
        run: python3 test_unit_conversions.py

      - name: Unit Tests - Sensor Fallback
        run: python3 test_sensor_fallback.py

      - name: Unit Tests - Output Safety
        run: python3 test_output_safety.py

      - name: Integration Tests - FSM Transitions
        run: python3 test_fsm_transitions.py

      - name: Diagnostic contracts and sanitized native replay
        run: python3 -m pytest -q

      - name: Generate Scenario Data
        run: python3 scenario_builder.py

      - name: Integration Tests - Python Scenarios
        run: python3 scenario_tester.py

      - name: Integration Tests - PID Compare
        run: python3 run_compare.py

  esphome-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Create secrets.yaml stub
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "test"
          wifi_password: "test"
          mqtt_broker: "127.0.0.1"
          mqtt_username: "test"
          mqtt_password: "test"
          ap_password: "test"
          api_encryption_key: "dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleTE="
          ota_password: "test"
          ha_token: "test"
          EOF

      - name: Validate YAML Syntax - Production Config
        run: python3 -c "import yaml; L=type('L',(yaml.SafeLoader,),{}); [L.add_constructor(t,lambda l,n:l.construct_scalar(n)) for t in ['!secret','!lambda','!include','!extend','!remove']]; yaml.load(open('stamplc.yaml'),Loader=L); print('stamplc.yaml OK')"

      - name: Validate YAML Syntax - Desk Config
        run: python3 -c "import yaml; L=type('L',(yaml.SafeLoader,),{}); [L.add_constructor(t,lambda l,n:l.construct_scalar(n)) for t in ['!secret','!lambda','!include','!extend','!remove']]; yaml.load(open('stamplc_desk.yaml'),Loader=L); print('stamplc_desk.yaml OK')"


  native-control-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build dependencies
        # This job only needs ESPHome and the stdlib driver. ESPHome pins
        # Paho 1.x; the separate Python-test job exercises the Paho 2.x tools.
        run: pip install esphome==2026.1.5
      - name: Build the actual host controller
        run: |
          python3 scenario_builder.py
          bash run_cpp.sh
      - name: Compare control outputs with diagnostic fault injection
        run: python3 verify_diagnostic_control.py
