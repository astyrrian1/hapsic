name: HAPSIC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.13.1
            3.14.3
      - name: Install isolated validation toolchains
        run: |
          python3.14 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          python3.13 -m venv .venv-firmware
          .venv-firmware/bin/python -m pip install -r requirements-firmware.txt
          git config core.hooksPath .githooks
      - name: Create non-production build secrets
        run: |
          .venv/bin/python - <<'PY'
          import base64
          import pathlib
          import yaml
          values = dict(wifi_ssid="ci-only", wifi_password="ci-only-password",
                        mqtt_broker="127.0.0.1", mqtt_username="ci", mqtt_password="ci",
                        ota_password="ci-only-password",
                        api_encryption_key=base64.b64encode(bytes(32)).decode())
          pathlib.Path("secrets.yaml").write_text(yaml.safe_dump(values))
          PY
      - name: Complete offline presubmit
        run: bash run_presubmit.sh

  # Preserve the existing required check name; the dependency runs actual
  # production, desk, and native builds, not YAML-only syntax checks.
  esphome-validation:
    needs: python-tests
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Firmware compilation passed in the shared presubmit gate."
