name: HAPSIC CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hapsic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    env:
      ESPHOME_DEFAULT_COMPILE_PROCESS_LIMIT: "1"
      PLATFORMIO_RUN_JOBS: "1"
    # Fork contributions run the same complete gate on hosted Linux.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-24.04"]' || '["self-hosted", "Linux", "X64", "halo-ci", "hapsic"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.13.1
            3.14.3
      - name: Install isolated validation toolchains
        run: |
          python3.14 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          python3.13 -m venv .venv-firmware
          .venv-firmware/bin/python -m pip install -r requirements-firmware.txt
          git config core.hooksPath .githooks
      - name: Create non-production build secrets
        run: |
          .venv/bin/python - <<'PY'
          import base64
          import pathlib
          import yaml
          values = dict(wifi_ssid="ci-only", wifi_password="ci-only-password",
                        mqtt_broker="127.0.0.1", mqtt_username="ci", mqtt_password="ci",
                        ota_password="ci-only-password",
                        api_encryption_key=base64.b64encode(bytes(32)).decode())
          pathlib.Path("secrets.yaml").write_text(yaml.safe_dump(values))
          PY
      - name: Complete offline presubmit
        run: |
          set -o pipefail
          bash run_presubmit.sh 2>&1 | tee presubmit.log
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presubmit-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            presubmit.log
            python_scenarios.txt
            python_sim_output.txt
            cpp_scenarios.txt

  # Preserve the existing required check name; the dependency runs actual
  # production, desk, and native builds, not YAML-only syntax checks.
  esphome-validation:
    needs: python-tests
    # Fork contributions run the same complete gate on hosted Linux.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-24.04"]' || '["self-hosted", "Linux", "X64", "halo-ci", "hapsic"]') }}
    timeout-minutes: 60
    steps:
      - run: echo "Firmware compilation passed in the shared presubmit gate."
