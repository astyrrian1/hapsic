[Service]
User=hapsic-ci
NoNewPrivileges=true
PrivateDevices=true
PrivateTmp=true
ProtectHome=true
ProtectSystem=strict
ReadWritePaths=/opt/hapsic-ci-runner /opt/hapsic-ci-toolcache /var/lib/hapsic-ci
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectProc=invisible
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
CapabilityBoundingSet=
IPAddressDeny=10.0.0.0/8
IPAddressDeny=172.16.0.0/12
IPAddressDeny=192.168.0.0/16
IPAddressDeny=169.254.0.0/16
IPAddressDeny=fc00::/7
IPAddressDeny=fe80::/10
IPAddressAllow=localhost
MemoryMax=2G
MemorySwapMax=0
CPUQuota=150%
TasksMax=256
Nice=10
UMask=0077
Environment=RUNNER_TOOL_CACHE=/opt/hapsic-ci-toolcache
Environment=AGENT_TOOLSDIRECTORY=/opt/hapsic-ci-toolcache
